<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор перекупа | RP Calculator</title>
  <style>
    :root {
      --bg-color: #0b0b0e;
      --card-bg: #16161e;
      --card-border: #2a2a38;
      --accent: #f39c12;
      --text-main: #f5f6fa;
      --text-muted: #a4b0be;
      --success: #2ed573;
      --danger: #ff4757;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .nav-tabs {
      display: flex;
      background: #111115;
      border-bottom: 1px solid var(--card-border);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
      text-align: center;
    }

    .tab-btn:hover {
      color: #fff;
    }

    .tab-btn.active {
      color: var(--accent);
      background: rgba(243, 156, 18, 0.05);
      border-bottom: 2px solid var(--accent);
    }

    .pane {
      padding: 24px;
      display: none;
    }

    .pane.active {
      display: block;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #fff;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #1e1e28;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .results {
      margin-top: 20px;
      background: #111115;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .val {
      font-weight: 600;
      color: #fff;
    }

    .divider {
      height: 1px;
      background: var(--card-border);
      margin: 10px 0;
    }

    .profit { color: var(--success); font-weight: bold; font-size: 17px; }
    .loss { color: var(--danger); font-weight: bold; font-size: 17px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('resell', this)">💰 Перекуп</button>
    <button class="tab-btn" onclick="switchTab('bp', this)">🎮 Фарм БП</button>
    <button class="tab-btn" onclick="switchTab('rent', this)">🚗 Аренда</button>
  </div>

  <!-- Перекуп -->
  <div id="resell" class="pane active">
    <h2>Калькулятор перекупа</h2>
    <div class="field">
      <label>Цена покупки ($)</label>
      <input type="number" id="r-buy" placeholder="1000000" oninput="calcResell()">
    </div>
    <div class="field">
      <label>Цена продажи ($)</label>
      <input type="number" id="r-sell" placeholder="1250000" oninput="calcResell()">
    </div>
    <div class="field">
      <label>Комиссия площадки</label>
      <select id="r-fee" onchange="calcResell()">
        <option value="0">С рук / Перевод (0%)</option>
        <option value="1">Банк (1%)</option>
        <option value="3">Торговая площадка (3%)</option>
        <option value="5">Рынок / Аукцион (5%)</option>
      </select>
    </div>

    <div class="results">
      <div class="row"><span>Комиссия:</span><span id="r-res-fee" class="val">$0</span></div>
      <div class="row"><span>Чистыми на руки:</span><span id="r-res-net" class="val">$0</span></div>
      <div class="divider"></div>
      <div class="row"><span>Чистая прибыль:</span><span id="r-res-profit" class="profit">$0</span></div>
      <div class="row"><span>ROI (Окупаемость):</span><span id="r-res-roi" class="val">0%</span></div>
    </div>
  </div>

  <!-- Фарм БП -->
  <div id="bp" class="pane">
    <h2>Калькулятор Battle Pass</h2>
    <div class="field">
      <label>Текущий уровень</label>
      <input type="number" id="bp-curr" placeholder="10" oninput="calcBP()">
    </div>
    <div class="field">
      <label>Целевой уровень</label>
      <input type="number" id="bp-target" placeholder="100" oninput="calcBP()">
    </div>
    <div class="field">
      <label>Текущий опыт (EXP)</label>
      <input type="number" id="bp-exp" placeholder="200" oninput="calcBP()">
    </div>

    <div class="results">
      <div class="row"><span>Осталось уровней:</span><span id="bp-res-lvl" class="val">0</span></div>
      <div class="row"><span>Всего EXP нужно:</span><span id="bp-res-exp" class="val">0 EXP</span></div>
      <div class="divider"></div>
      <div class="row"><span>Дней (~1000 EXP/день):</span><span id="bp-res-days" class="val" style="color:var(--accent);">0 дн.</span></div>
    </div>
  </div>

  <!-- Аренда -->
  <div id="rent" class="pane">
    <h2>Калькулятор аренды</h2>
    <div class="field">
      <label>Стоимость аренды в час ($)</label>
      <input type="number" id="ar-rate" placeholder="50000" oninput="calcRent()">
    </div>
    <div class="field">
      <label>Количество часов</label>
      <input type="number" id="ar-hours" placeholder="5" oninput="calcRent()">
    </div>

    <div class="results">
      <div class="row"><span>Доход от аренды:</span><span id="ar-res-total" class="profit">$0</span></div>
    </div>
  </div>
</div>

<script>
  function switchTab(id, btn) {
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  function calcResell() {
    const buy = parseFloat(document.getElementById('r-buy').value) || 0;
    const sell = parseFloat(document.getElementById('r-sell').value) || 0;
    const feePct = parseFloat(document.getElementById('r-fee').value) || 0;

    const fee = sell * (feePct / 100);
    const net = sell - fee;
    const profit = net - buy;
    const roi = buy > 0 ? ((profit / buy) * 100).toFixed(2) : 0;

    document.getElementById('r-res-fee').innerText = '$' + fee.toLocaleString('ru-RU');
    document.getElementById('r-res-net').innerText = '$' + net.toLocaleString('ru-RU');
    
    const pEl = document.getElementById('r-res-profit');
    pEl.innerText = (profit >= 0 ? '+' : '') + '$' + profit.toLocaleString('ru-RU');
    pEl.className = profit >= 0 ? 'profit' : 'loss';
    
    document.getElementById('r-res-roi').innerText = roi + '%';
  }

  function calcBP() {
    const curr = parseInt(document.getElementById('bp-curr').value) || 0;
    const target = parseInt(document.getElementById('bp-target').value) || 0;
    const exp = parseInt(document.getElementById('bp-exp').value) || 0;

    if (target > curr) {
      const lvls = target - curr;
      const totalExp = (lvls * 1000) - exp;
      const days = Math.ceil(Math.max(0, totalExp) / 1000);

      document.getElementById('bp-res-lvl').innerText = lvls;
      document.getElementById('bp-res-exp').innerText = Math.max(0, totalExp).toLocaleString('ru-RU') + ' EXP';
      document.getElementById('bp-res-days').innerText = days + ' дн.';
    } else {
      document.getElementById('bp-res-lvl').innerText = '0';
      document.getElementById('bp-res-exp').innerText = '0 EXP';
      document.getElementById('bp-res-days').innerText = '0 дн.';
    }
  }

  function calcRent() {
    const rate = parseFloat(document.getElementById('ar-rate').value) || 0;
    const hours = parseFloat(document.getElementById('ar-hours').value) || 0;
    const total = rate * hours;

    document.getElementById('ar-res-total').innerText = '+' + '$' + total.toLocaleString('ru-RU');
  }
</script>

</body>
</html>
