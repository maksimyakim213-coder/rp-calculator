<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог GTA 5 RP</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        .search-container { text-align: center; margin-bottom: 20px; }
        .search-container input { width: 50%; padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #444; background: #1e1e1e; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 15px; text-align: center; border: 1px solid #333; }
        .card img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; }
        .card h3 { font-size: 14px; margin: 10px 0; height: 40px; overflow: hidden; }
        .card .price { color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Каталог вещей GTA 5 RP</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Поиск по названию предмета...">
    </div>

    <div class="grid" id="catalogGrid"></div>

    <script>
        let allItems = [];

        // Загружаем наш JSON-файл
        fetch('items.json')
            .then(response => response.json())
            .then(data => {
                // Если данные обернуты в объект с ключом items, берем его, иначе сам массив
                allItems = Array.isArray(data) ? data : (data.items || []);
                displayItems(allItems);
            })
            .catch(error => console.error('Ошибка загрузки каталога:', error));

        // Функция отрисовки карточек
        function displayItems(items) {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const imgUrl = item.image_url || '';
                const name = item.name || 'Без названия';
                const price = item.attributes && item.attributes.price ? item.attributes.price.toLocaleString() + ' $' : 'Цена не указана';

                card.innerHTML = `
                    <img src="${imgUrl}" alt="${name}" onerror="this.src='https://via.placeholder.com/100?text=No+Image'">
                    <h3>${name}</h3>
                    <div class="price">${price}</div>
                `;
                grid.appendChild(card);
            });
        }

        // Поиск по сайту
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchText = e.target.value.toLowerCase();
            const filtered = allItems.filter(item => item.name.toLowerCase().includes(searchText));
            displayItems(filtered);
        });
    </script>
</body>
</html>
